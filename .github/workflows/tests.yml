name: Automated Tests

on: pull_request

jobs:
  jest:
    name: Vitest Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run rebuild:approved

      - run: npm run test:ci
